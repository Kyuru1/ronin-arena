<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#20302c;color:#eee}canvas{image-rendering:pixelated}</style><canvas id="sheet" width="1800" height="1400"></canvas><script type="module">
import {loadKyunethArt} from '/src/story/world/referenceArt.ts';
import {humanFrame} from '/src/story/characters/renderer.ts';
import {animalFrame} from '/src/story/characters/animals.ts';
import {DIRECTIONS,RESIDENTS} from '/src/story/characters/catalog.ts';
const c=document.querySelector('canvas').getContext('2d'),roles=['player',...Object.keys(RESIDENTS),'dog','chicken'],errors=[],stats=[];
c.imageSmoothingEnabled=false;c.font='15px monospace';c.textBaseline='top';
const get=(role,dir,walk,i)=>role==='dog'||role==='chicken'?animalFrame(role,dir,walk,i):humanFrame(role,dir,walk,i);
const region=(im,x0,y0,x1,y1)=>{const p=im.getContext('2d').getImageData(0,0,im.width,im.height).data,a=[];for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let i=(y*im.width+x)*4;a.push(p[i],p[i+1],p[i+2],p[i+3])}return a.join(',')};
try{await loadKyunethArt();
for(let row=0;row<roles.length;row++){const role=roles[row],y=25+row*132;c.fillStyle=row%2?'#253932':'#2c423a';c.fillRect(0,y-8,1800,126);c.fillStyle='#f5dfa3';c.fillText(role,8,y+38);
for(let d=0;d<4;d++){const dir=DIRECTIONS[d],x=100+d*420;c.fillStyle='#e9deb9';c.fillText(dir,x,y-2);
const idle=get(role,dir,false,0),walk=[0,1,2,3].map(i=>get(role,dir,true,i));if(!idle||walk.some(v=>!v)){errors.push(role+' '+dir+' missing');continue}
for(let i=0;i<5;i++){const im=i?walk[i-1]:idle;c.drawImage(im,x+i*82,y+18,im.width*1.3,im.height*1.3);c.fillText(i?'W'+(i-1):'ID',x+i*82,y+103)}
const distinct=new Set(walk.map(im=>im.toDataURL())).size;if(distinct<4)errors.push(role+' '+dir+' repeated walk frames');
if(role!=='dog'&&role!=='chicken'){if(new Set(walk.map(im=>region(im,0,0,56,28))).size!==1)errors.push(role+' '+dir+' head changed');if(new Set(walk.map(im=>region(im,19,33,38,46))).size!==1)errors.push(role+' '+dir+' torso changed')}
stats.push({role,dir,distinct})}}
for(const role of roles){if(get(role,'left',false,0).toDataURL()===get(role,'right',false,0).toDataURL())errors.push(role+' identical profiles');if(get(role,'down',false,0).toDataURL()===get(role,'up',false,0).toDataURL())errors.push(role+' identical front/back')}
window.report={characters:roles.length,directions:4,stats,errors}
}catch(e){window.report={errors:[String(e)]}}window.ready=true;
</script></html>
